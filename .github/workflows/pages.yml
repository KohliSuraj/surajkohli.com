name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
# Upload and deploy run in separate jobs, as actions/deploy-pages recommends. In one job the
# deploy step can look up the artifact before GitHub lists it and fail with
# "No artifacts named github-pages" (actions/deploy-pages#451). A re-run of such a run then
# fails with "Multiple artifacts named github-pages", so push a new commit or use
# workflow_dispatch instead of re-running.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
